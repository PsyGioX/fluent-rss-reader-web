<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{SEO}}
<link rel="stylesheet" href="{{ICONS}}">
<link rel="stylesheet" href="{{CSS}}">
</head>

<body>
<div class="progress" id="progress" aria-hidden="true"></div>

<div class="app">
  <!-- ЛЕВАЯ КОЛОНКА -->
  <aside class="rail" id="rail" aria-label="Ленты">
    <div class="rail__head">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true">
          <img class="brand__logo" src="/favicon/logo%201.svg" alt="Fluent RSS logo">
        </span>
        <span>
          <span class="brand__name">Fluent RSS</span><br>
          <span class="brand__sub" id="feedStat">0 лент</span>
        </span>
      </span>
      <button class="btn btn--icon btn--quiet only-mobile" id="closeRail" aria-label="Закрыть меню" style="margin-left:auto">
        <i class="icon bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>

    <div class="rail__body">
      <div class="rail__section">
        <div class="rail__label"><span data-i18n="all_categories">Все ленты</span><span class="rail__count" id="allCount">0</span></div>
        <div class="list" id="feedList"></div>
      </div>
    </div>

    <div class="rail__foot">
      <button class="btn btn--tiny" id="btnRecommend" data-i18n-title="recommendations">
        <i class="icon bi bi-stars" aria-hidden="true"></i>
        <span data-i18n="recommendations">Подборки</span>
      </button>
      <button class="btn btn--tiny" id="btnLibrary">
        <i class="icon bi bi-list-ul" aria-hidden="true"></i>
        <span data-i18n="feed_management_title">Ленты</span>
      </button>
      <button class="btn btn--tiny" id="btnFiles">
        <i class="icon bi bi-file-earmark-arrow-down" aria-hidden="true"></i>
        <span>OPML</span>
      </button>
      <button class="btn btn--tiny" id="btnTheme" data-i18n-title="toggle_theme">
        <i class="icon bi bi-moon-stars" id="themeIcon" aria-hidden="true"></i>
        <span data-i18n="theme">Тема</span>
      </button>
    </div>
  </aside>

  <!-- ПРАВАЯ КОЛОНКА -->
  <main class="main">
    <header class="topbar">
      <button class="btn btn--icon btn--quiet only-mobile" id="openRail" aria-label="Открыть ленты">
        <i class="icon bi bi-list" aria-hidden="true"></i>
      </button>

      <form class="composer" id="composer" autocomplete="off">
        <span class="composer__icon" aria-hidden="true">
          <i class="icon bi bi-rss" aria-hidden="true"></i>
        </span>
        <label class="sr-only" for="rssUrl" data-i18n="rss_url_label">Адрес RSS-ленты</label>
        <input id="rssUrl" type="text" inputmode="url" spellcheck="false"
               placeholder="Вставьте ссылку на сайт или RSS…" data-i18n-placeholder="rss_url_placeholder">
        <label class="sr-only" for="categorySelect" data-i18n="category_label">Категория</label>
        <select id="categorySelect"></select>
        <button class="btn btn--primary btn--tiny" type="submit" id="btnAdd" data-i18n="add_feed_btn">Добавить</button>
      </form>

      <button class="btn btn--icon" id="btnRefresh" data-i18n-title="refresh" aria-label="Обновить">
        <i class="icon bi bi-arrow-clockwise" aria-hidden="true"></i>
      </button>
      <select id="languageSelect" class="btn btn--tiny" aria-label="Язык" style="width:auto"></select>
    </header>

    <div class="feed-head">
      <div>
        <h1 class="feed-head__title" id="feedTitle">{{HEADING}}</h1>
        <p class="feed-head__meta" id="feedMeta" data-i18n="no_feeds_message">{{TAGLINE}}</p>
      </div>
      <div class="segmented" id="sortSwitch" role="group">
        <button type="button" data-sort="date" aria-pressed="true">По дате</button>
        <button type="button" data-sort="title" aria-pressed="false">По названию</button>
      </div>
    </div>

    <div class="chips" id="chips"></div>
    <div id="content"></div>
  </main>
</div>

<!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->
<nav class="mobilebar" aria-label="Навигация">
  <button id="mobFeeds"><i class="icon bi bi-list" aria-hidden="true"></i><span data-i18n="menu">Ленты</span></button>
  <button id="mobRefresh"><i class="icon bi bi-arrow-clockwise" aria-hidden="true"></i><span data-i18n="refresh">Обновить</span></button>
  <button id="mobRecommend"><i class="icon bi bi-stars" aria-hidden="true"></i><span data-i18n="recommendations">Подборки</span></button>
  <button id="mobTop"><i class="icon bi bi-arrow-up" aria-hidden="true"></i><span data-i18n="scroll_top">Наверх</span></button>
</nav>

<!-- УНИВЕРСАЛЬНЫЙ ОВЕРЛЕЙ -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <div id="sheetTools" style="display:flex;gap:6px"></div>
      <button class="btn btn--icon btn--quiet" id="sheetClose" data-i18n-title="close" aria-label="Закрыть">
        <i class="icon bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
    <div class="sheet__foot" id="sheetFoot" hidden></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".opml,.xml,.json,text/xml,application/json" hidden>

<script src="{{I18N}}" defer></script>
<script src="{{CATALOG}}" defer></script>
<script src="{{APP}}" defer></script>
</body>
</html>
